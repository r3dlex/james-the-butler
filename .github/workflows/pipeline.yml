name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Architecture Gate
  # --------------------------------------------------------------------------
  _archgate-self-hosted:
    name: "Architecture Gate (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/pipeline_runner
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        run: poetry install

      - name: Run architecture gate
        run: poetry run pipeline-runner archgate

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  archgate:
    name: Architecture Gate
    needs: _archgate-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pipeline_runner
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._archgate-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._archgate-self-hosted.outputs.passed != 'true'

      - name: Install Poetry
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        run: pipx install poetry

      - uses: actions/setup-python@v5
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        run: poetry install

      - name: Run architecture gate
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        run: poetry run pipeline-runner archgate

  # --------------------------------------------------------------------------
  # Pipeline Runner Lint
  # --------------------------------------------------------------------------
  _pipeline-lint-self-hosted:
    name: "Pipeline Runner Lint (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/pipeline_runner
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        run: poetry install

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy src/

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  pipeline-lint:
    name: Pipeline Runner Lint
    needs: _pipeline-lint-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pipeline_runner
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._pipeline-lint-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'

      - name: Install Poetry
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        run: pipx install poetry

      - uses: actions/setup-python@v5
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        run: poetry install

      - name: Ruff check
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        run: poetry run ruff check .

      - name: Ruff format
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        run: poetry run ruff format --check .

      - name: Mypy
        if: needs._pipeline-lint-self-hosted.outputs.passed != 'true'
        run: poetry run mypy src/

  # --------------------------------------------------------------------------
  # Pipeline Runner Tests
  # --------------------------------------------------------------------------
  _pipeline-test-self-hosted:
    name: "Pipeline Runner Tests (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/pipeline_runner
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        run: poetry install

      - name: Run tests with coverage
        run: poetry run pytest --cov=pipeline_runner --cov-report=term-missing

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  pipeline-test:
    name: Pipeline Runner Tests
    needs: _pipeline-test-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pipeline_runner
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._pipeline-test-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._pipeline-test-self-hosted.outputs.passed != 'true'

      - name: Install Poetry
        if: needs._pipeline-test-self-hosted.outputs.passed != 'true'
        run: pipx install poetry

      - uses: actions/setup-python@v5
        if: needs._pipeline-test-self-hosted.outputs.passed != 'true'
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: tools/pipeline_runner/poetry.lock

      - name: Install dependencies
        if: needs._pipeline-test-self-hosted.outputs.passed != 'true'
        run: poetry install

      - name: Run tests with coverage
        if: needs._pipeline-test-self-hosted.outputs.passed != 'true'
        run: poetry run pytest --cov=pipeline_runner --cov-report=term-missing

  # --------------------------------------------------------------------------
  # Backend Tests (Elixir + Postgres)
  # --------------------------------------------------------------------------
  _backend-test-self-hosted:
    name: "Backend Tests (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: james_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: backend/deps
          key: mix-${{ hashFiles('backend/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          MIX_ENV: test
          DB_PORT: 5432

      - name: Run tests
        run: mix test --cover || (echo "::error::mix test --cover failed — see output above" && exit 1)
        env:
          MIX_ENV: test
          DB_PORT: 5432

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  backend-test:
    name: Backend Tests
    needs: _backend-test-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: james_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._backend-test-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._backend-test-self-hosted.outputs.passed != 'true'

      - uses: erlef/setup-beam@v1
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: backend/deps
          key: mix-${{ hashFiles('backend/mix.lock') }}

      - name: Install dependencies
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        run: mix deps.get

      - name: Compile
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        run: mix compile

      - name: Check formatting
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        run: mix format --check-formatted

      - name: Setup database
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        run: mix ecto.create && mix ecto.migrate
        env:
          MIX_ENV: test
          DB_PORT: 5432

      - name: Run tests
        if: needs._backend-test-self-hosted.outputs.passed != 'true'
        run: mix test --cover || (echo "::error::mix test --cover failed — see output above" && exit 1)
        env:
          MIX_ENV: test
          DB_PORT: 5432

  # --------------------------------------------------------------------------
  # Frontend Tests (Node)
  # --------------------------------------------------------------------------
  _frontend-test-self-hosted:
    name: "Frontend Tests (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: rm -rf node_modules && npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  frontend-test:
    name: Frontend Tests
    needs: _frontend-test-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._frontend-test-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._frontend-test-self-hosted.outputs.passed != 'true'

      - uses: actions/setup-node@v4
        if: needs._frontend-test-self-hosted.outputs.passed != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs._frontend-test-self-hosted.outputs.passed != 'true'
        run: rm -rf node_modules && npm ci

      - name: Lint
        if: needs._frontend-test-self-hosted.outputs.passed != 'true'
        run: npm run lint

      - name: Test
        if: needs._frontend-test-self-hosted.outputs.passed != 'true'
        run: npm test

  # --------------------------------------------------------------------------
  # CLI Tests (Elixir)
  # --------------------------------------------------------------------------
  _cli-test-self-hosted:
    name: "CLI Tests (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: cli
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: cli/deps
          key: mix-cli-${{ hashFiles('cli/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Run tests with coverage
        run: mix test --cover

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  cli-test:
    name: CLI Tests
    needs: _cli-test-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._cli-test-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._cli-test-self-hosted.outputs.passed != 'true'

      - uses: erlef/setup-beam@v1
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: cli/deps
          key: mix-cli-${{ hashFiles('cli/mix.lock') }}

      - name: Install dependencies
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        run: mix deps.get

      - name: Compile
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        run: mix compile

      - name: Check formatting
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        run: mix format --check-formatted

      - name: Credo
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        run: mix credo --strict

      - name: Run tests with coverage
        if: needs._cli-test-self-hosted.outputs.passed != 'true'
        run: mix test --cover

  # --------------------------------------------------------------------------
  # Docs Build (Node)
  # --------------------------------------------------------------------------
  _docs-build-self-hosted:
    name: "Docs Build (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: docs
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  docs-build:
    name: Docs Build
    needs: _docs-build-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._docs-build-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._docs-build-self-hosted.outputs.passed != 'true'

      - uses: actions/setup-node@v4
        if: needs._docs-build-self-hosted.outputs.passed != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        if: needs._docs-build-self-hosted.outputs.passed != 'true'
        run: npm ci

      - name: Build docs
        if: needs._docs-build-self-hosted.outputs.passed != 'true'
        run: npm run build

  # --------------------------------------------------------------------------
  # Mobile Tests (Flutter)
  # --------------------------------------------------------------------------
  _mobile-test-self-hosted:
    name: "Mobile Tests (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Test
        run: flutter test

      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  mobile-test:
    name: Mobile Tests
    needs: _mobile-test-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._mobile-test-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'

      - uses: subosito/flutter-action@v2
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'
        with:
          channel: stable

      - name: Install dependencies
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'
        run: flutter pub get

      - name: Analyze
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'
        run: flutter analyze

      - name: Format check
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'
        run: dart format --set-exit-if-changed .

      - name: Test
        if: needs._mobile-test-self-hosted.outputs.passed != 'true'
        run: flutter test
